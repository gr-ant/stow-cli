[project]
name = "stw"
version = "0.1.0"
description = "A CLI workspace manager for agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vector = ["numpy>=1.24"]
data = ["duckdb>=0.10"]
dev = ["pytest>=7", "numpy>=1.24", "duckdb>=0.10"]

[project.scripts]
stw = "stw.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
